[package]
name = "mentischat-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "test-util"] }
# Same pin as the main crate; the lib is named `mcp`.
cloudllm_mcp = { version = "=0.3.6", features = ["server"] }
mentischat = { path = ".." }

# Its own workspace: keeps the fuzz crate out of the parent package's builds,
# clippy runs, MSRV check and published tarball.
[workspace]
members = ["."]

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_json"
path = "fuzz_targets/tool_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_restore"
path = "fuzz_targets/snapshot_restore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ws_frame"
path = "fuzz_targets/ws_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bus_ops"
path = "fuzz_targets/bus_ops.rs"
test = false
doc = false
bench = false
