name: fuzz

# Time-boxed fuzzing of every target, weekly and on demand: not on every push
# (ci.yml replays the committed corpora on every push, in seconds). The matrix
# is read from `cargo fuzz list`, so a new target is fuzzed without editing
# this file. docs/ENGINEERING.md says what to do with a crash or a grown corpus.
on:
  # security.yml calls this workflow with a longer run.
  workflow_call:
    inputs:
      seconds:
        type: string
        default: "300"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fuzz
      - id: list
        run: echo "list=$(make --no-print-directory fuzz-targets)" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fuzz
      - name: Fuzz ${{ matrix.target }}
        run: make fuzz TARGET=${{ matrix.target }} FUZZ_SECONDS=${{ inputs.seconds || 300 }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
      # The corpus the run grew. A human downloads it, runs `make fuzz-cmin`
      # and commits what is new; CI never pushes to the repository.
      - name: Upload grown corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          retention-days: 30
          if-no-files-found: ignore
