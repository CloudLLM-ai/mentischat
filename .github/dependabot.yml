# Weekly pull requests for Cargo dependencies and for the actions used by the
# workflows. Updates arrive as pull requests and run the full CI before anyone
# merges them. See docs/ENGINEERING.md.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Patch and minor updates arrive as one pull request; majors stay separate
    # because they are the ones that need reading.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: cloudllm_mcp is `=0.4.0` (unstable API between minors).
      - dependency-name: cloudllm_mcp
      # Held at the newest release that supports the MSRV (Rust 1.91):
      # parking_lot 0.13 needs 1.95.
      - dependency-name: parking_lot
        versions: [">=0.13.0"]
      # The test WebSocket client follows the tokio-tungstenite that axum uses
      # (0.29 through the pinned cloudllm_mcp), so one copy is built. Move both
      # together when axum moves.
      - dependency-name: tokio-tungstenite
        versions: [">=0.30.0"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
