[package]
name = "mentischat-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "test-util", "io-util", "net"] }
# Same pin as the main crate; the lib is named `mcp`.
cloudllm_mcp = { version = "=0.4.1", features = ["server"] }
mentischat = { path = ".." }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

# Its own workspace: keeps the fuzz crate out of the parent package's builds,
# clippy runs, MSRV check and published tarball.
[workspace]
members = ["."]

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tool_json"
path = "fuzz_targets/tool_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_restore"
path = "fuzz_targets/snapshot_restore.rs"
test = false
doc = false
bench = false

[[bin]]
