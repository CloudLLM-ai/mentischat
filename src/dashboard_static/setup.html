<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MentisChat Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --primary: #1f6feb; --primary-hover: #388bfd; --err: #f85149;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: var(--font); padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 32px 28px; text-align: center;
  }
  .logo { font-size: 2.2rem; line-height: 1; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 12px 0 4px; }
  p { color: var(--muted); margin: 0 0 22px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 1.2rem; text-align: center; letter-spacing: 0.25em;
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; padding: 10px; font-size: 1rem; font-weight: 600; cursor: pointer;
    background: var(--primary); color: #fff; border: 0; border-radius: 6px;
  }
  button:hover { background: var(--primary-hover); }
  input::placeholder { letter-spacing: normal; font-size: 0.95rem; }
  .hint { font-size: 0.85rem; margin: 16px 0 0; }
  .error {
    display: none; margin-bottom: 16px; padding: 8px 10px; border-radius: 6px; color: var(--err);
    background: rgba(248, 81, 73, 0.12); border: 1px solid rgba(248, 81, 73, 0.35);
  }
</style>
</head>
<body>
  <form class="card" method="POST" action="/dashboard/setup">
    <div class="logo">💬</div>
    <h1>Welcome to MentisChat</h1>
    <p>Choose a PIN for this dashboard. You will need it every time you open it.</p>
    <div class="error" id="error"></div>
    <input type="password" name="pin" autocomplete="new-password" autofocus required minlength="6" maxlength="128" aria-label="New PIN" placeholder="New PIN">
    <input type="password" name="confirm" autocomplete="new-password" required minlength="6" maxlength="128" aria-label="Confirm PIN" placeholder="Confirm PIN" style="margin-top:10px">
    <button type="submit">Set PIN</button>
    <p class="hint">At least 6 characters. Stored hashed in the data directory; change it later under Settings.</p>
  </form>
  <script>
    const errors = {
      mismatch: 'The two PINs differ',
      length: 'A PIN has 6 to 128 characters',
      storage: 'The PIN could not be saved; see the daemon log',
    };
    const code = new URLSearchParams(location.search).get('error');
    if (code) {
      const box = document.getElementById('error');
      box.textContent = errors[code] || 'Try again';
      box.style.display = 'block';
    }
  </script>
</body>
</html>
