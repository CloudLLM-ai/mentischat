name: ci

# The gates every change passes: formatting, type check, lints, tests, docs,
# the MSRV, coverage and the fuzz corpus replay. Each step is one Makefile
# target, so `make <target>` reproduces it locally; docs/ENGINEERING.md lists
# them with their thresholds. Dependency policy is audit.yml, benchmarks are
# bench.yml, longer fuzzing is fuzz.yml, the weekly review is security.yml and
# the soak test is soak.yml.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # mentischat is Unix-only by design (data directory permissions, SIGTERM),
    # so both supported platforms are covered and Windows is not attempted.
    # macOS uses the Intel image: hosted arm64 Mac runners are
    # capacity-constrained, and a job waiting for one is cancelled after 15
    # minutes without running.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: make fmt-check
      - run: make check
      - run: make clippy
      - run: make test
      - run: make doc

  msrv:
    # Guards the rust-version claim in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: make msrv

  coverage:
    # Tests under instrumentation, then the gate in scripts/coverage_gate.py:
    # at least 90% of regions, functions and lines. The HTML report and the
    # lcov file are the artifact; the table is the job summary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: make coverage
      - name: Job summary
        if: always()
        run: cat target/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            target/coverage/html
            target/coverage/lcov.info
            target/coverage/summary.json
          if-no-files-found: ignore

  fuzz:
    # Builds every fuzz target and replays the committed corpora: seconds, and
    # it catches harness rot and regressions on old findings. Time-boxed
    # fuzzing runs in fuzz.yml. Needs nightly, so it stays out of `verify`.
    runs-on: ubuntu-latest
    env:
      # The fuzz crate is not part of the stable gates; -D warnings from the
      # workflow env would fail the nightly build on dependency lints.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-fuzz
      - run: make fuzz-build
      - run: make fuzz-replay
