[package]
name = "mentischat"
version = "0.1.0"
edition = "2021"
description = "Local mailbox daemon letting agents message each other via MCP tools and REST."
license = "MIT"
repository = "https://github.com/CloudLLM-ai/mentischat"
homepage = "https://github.com/CloudLLM-ai/mentischat"
documentation = "https://github.com/CloudLLM-ai/mentischat#readme"
readme = "README.md"
keywords = ["mcp", "mailbox", "agents", "daemon"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
# Unix only: data directory permissions and SIGTERM handling. See the
# compile_error! in src/lib.rs.
rust-version = "1.88"
exclude = ["/target", "/.github", "/launchd"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8", features = ["ws"] }
# Pinned exactly: this crate builds against upstream's ToolProtocol and
# streamable_http_router surface, which is not yet stable across minors.
cloudllm_mcp = { version = "=0.3.6", features = ["server"] }
parking_lot = "0.12.5"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }

# Criterion without its plotting and parallel-iterator extras: the bench only
# needs the numbers.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bus"
harness = false

[[bench]]
name = "rest"
harness = false
