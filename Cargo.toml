[package]
name = "mentischat"
version = "0.1.0"
edition = "2021"
description = "Local mailbox daemon letting agents message each other via MCP tools and REST."
license = "MIT"
repository = "https://github.com/CloudLLM-ai/mentischat"
documentation = "https://github.com/CloudLLM-ai/mentischat#readme"
readme = "README.md"
keywords = ["mcp", "mailbox", "agents", "daemon"]
categories = ["command-line-utilities", "development-tools", "network-programming"]
# Unix only: data directory permissions and SIGTERM handling. See the
# compile_error! in src/lib.rs.
rust-version = "1.91"
exclude = ["/target", "/.github", "/launchd", "/fuzz"]

[features]
# The client component of end-to-end encrypted rooms (`mentischat client`).
# Off, the crate is the daemon alone and pulls none of the OpenMLS stack.
default = ["e2e"]
e2e = ["dep:openmls", "dep:openmls_rust_crypto", "dep:openmls_basic_credential", "dep:openmls_traits", "dep:openmls_memory_storage"]

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8", features = ["ws"] }
# Pinned exactly: this crate builds against upstream's ToolProtocol and
# streamable_http_router surface, which is not yet stable across minors.
cloudllm_mcp = { version = "=0.4.1", features = ["server"] }
# Ed25519 for signed rooms: the same scheme and raw key bytes as MentisDB. 2.x
# (not 3.x) so the OpenMLS stack of phase 2 shares one copy.
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
# MLS (RFC 9420) for end-to-end encrypted rooms. Client only (feature `e2e`).
# 0.9 / 0.6: the 0.8 / 0.5 stack locked hpke-rs 0.6, whose optional libcrux
# backend pinned libcrux-chacha20poly1305 0.0.7 (GHSA-hc3c-63hc-2r9f). It was
# never compiled, but 0.9 is the maintained line. 0.9 requires Rust 1.91,
# hence this crate's MSRV.
openmls = { version = "0.9.2", optional = true }
openmls_basic_credential = { version = "0.6", optional = true }
openmls_memory_storage = { version = "0.6", optional = true }
openmls_rust_crypto = { version = "0.6", optional = true }
openmls_traits = { version = "0.6", optional = true }
parking_lot = "0.12.5"
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1.5"
tempfile = "3.27.0"
# Virtual time for `#[tokio::test(start_paused = true)]`: a sleep only advances
# once every task is idle, so "wait until the pull has parked" is exact.
tokio = { version = "1.53.1", features = ["full", "test-util"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }

# Criterion without its plotting and parallel-iterator extras: the bench only
# needs the numbers.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "bus"
harness = false

[[bench]]
name = "rest"
harness = false

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "signed"
harness = false
required-features = ["e2e"]
